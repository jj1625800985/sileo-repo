<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sxllm - 个人 Sileo/Cydia 越狱源，提供 AI 开发工具、系统优化、灵动岛美化等插件">
    <title>Sxllm 源 - Sileo/Cydia 越狱源</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0d0d1a;
            --bg-secondary: #151528;
            --bg-card: #1c1c36;
            --bg-card-hover: #24244a;
            --text-primary: #f0f0f8;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --accent: #4A90D9;
            --accent-light: #6ab0f9;
            --accent-gradient: linear-gradient(135deg, #4A90D9, #9013FE);
            --border: #2a2a50;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        a { color: var(--accent-light); text-decoration: none; transition: opacity 0.2s; }
        a:hover { opacity: 0.8; }
        img { max-width: 100%; height: auto; }

        /* ===== Header / Hero ===== */
        .hero {
            background: var(--bg-secondary);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(74,144,217,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(144,19,254,0.06) 0%, transparent 60%);
            border-bottom: 1px solid var(--border);
            padding: 60px 20px 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(74,144,217,0.03) 0%, transparent 50%);
            animation: heroGlow 10s ease-in-out infinite alternate;
        }
        @keyframes heroGlow {
            0% { transform: translate(-10%, -10%) rotate(0deg); }
            100% { transform: translate(10%, 10%) rotate(5deg); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
        }
        .repo-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(74,144,217,0.3);
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.08);
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin: 12px 0 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ===== Buttons ===== */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(74,144,217,0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(74,144,217,0.5);
            opacity: 1;
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            opacity: 1;
        }
        .btn .icon { font-size: 1.2rem; line-height: 1; }

        .add-instructions {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 16px;
        }
        .add-instructions code {
            background: var(--bg-card);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--accent-light);
            user-select: all;
        }

        /* ===== Sections ===== */
        .section {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .badge {
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 2px 12px;
            border-radius: 50px;
        }
        .section-desc {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        /* ===== Package Cards ===== */
        .pkg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .pkg-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            gap: 16px;
            transition: all 0.25s ease;
            cursor: default;
        }
        .pkg-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(74,144,217,0.3);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .pkg-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            flex-shrink: 0;
            background: var(--bg-secondary);
            object-fit: cover;
        }
        .pkg-info {
            flex: 1;
            min-width: 0;
        }
        .pkg-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pkg-version {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .pkg-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .pkg-section-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 50px;
            margin-top: 8px;
            background: rgba(74,144,217,0.12);
            color: var(--accent-light);
        }
        .pkg-section-tag.tweaks { background: rgba(245,166,35,0.12); color: #F5A623; }
        .pkg-section-tag.development { background: rgba(126,211,33,0.12); color: #7ED321; }
        .pkg-section-tag.utilities { background: rgba(74,144,217,0.12); color: #6ab0f9; }
        .pkg-section-tag.terminal { background: rgba(80,227,194,0.12); color: #50E3C2; }
        .pkg-section-tag.split { background: rgba(144,19,254,0.12); color: #b060f9; }
        .pkg-section-tag.system { background: rgba(208,27,27,0.12); color: #f06060; }
        .pkg-section-tag.dynamic { background: rgba(245,166,35,0.12); color: #F5A623; }

        /* ===== Stats Bar ===== */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 20px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 1.6rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-item .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ===== Filter / Search ===== */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .filter-btn.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #fff;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 18px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-muted); }

        /* ===== Footer ===== */
        .footer {
            border-top: 1px solid var(--border);
            padding: 30px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .footer-links a { color: var(--text-secondary); font-size: 0.85rem; }

        /* ===== Toast / Copy Feedback ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: var(--text-primary);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Page Sections ===== */
        .featured-section { padding-top: 20px; }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .hero { padding: 40px 16px 36px; }
            .hero h1 { font-size: 1.6rem; }
            .repo-icon { width: 64px; height: 64px; }
            .btn { padding: 12px 20px; font-size: 0.9rem; }
            .pkg-grid { grid-template-columns: 1fr; }
            .stats-bar { gap: 24px; }
            .filter-bar { flex-direction: column; }
            .search-input { min-width: auto; }
        }
    </style>
</head>
<body>

<!-- ========== Hero ========== -->
<header class="hero">
    <div class="hero-content">
        <img src="CydiaIcon.png" alt="Sxllm" class="repo-icon" onerror="this.style.display='none'">
        <h1>Sxllm 源</h1>
        <p class="subtitle">Zone 插件、AI 开发工具、系统美化、灵动岛优化 — 为越狱设备打造的精选插件集合</p>

        <div class="btn-group">
            <a href="javascript:void(0)" class="btn btn-primary" onclick="addToSileo()">
                <span class="icon">+</span> 添加到 Sileo
            </a>
            <a href="javascript:void(0)" class="btn btn-secondary" onclick="copySourceUrl()">
                <span class="icon">📋</span> 复制源地址
            </a>
        </div>
        <p class="add-instructions">
            或手动添加源地址：<code onclick="copySourceUrl()">https://jj1625800985.github.io/sileo-repo</code>
        </p>
    </div>
</header>

<!-- ========== Stats ========== -->
<div class="stats-bar">
    <div class="stat-item">
        <div class="num" id="pkgCount">16</div>
        <div class="label">插件数量</div>
    </div>
    <div class="stat-item">
        <div class="num" id="sectionCount">6</div>
        <div class="label">分类</div>
    </div>
    <div class="stat-item">
        <div class="num">arm64</div>
        <div class="label">架构支持</div>
    </div>
</div>

<!-- ========== Featured Section ========== -->
<section class="section featured-section" id="featured">
    <h2 class="section-title">精选插件 <span class="badge">Featured</span></h2>
    <p class="section-desc">最受欢迎和推荐的插件，一键查看更多详情</p>
    <div class="pkg-grid" id="featuredGrid"></div>
</section>

<!-- ========== All Packages Section ========== -->
<section class="section" id="packages">
    <h2 class="section-title">全部插件</h2>
    <p class="section-desc">浏览源中所有可用插件，按分类筛选或搜索</p>

    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all" onclick="filterPackages('all')">全部</button>
        <button class="filter-btn" data-filter="开发工具" onclick="filterPackages('开发工具')">开发工具</button>
        <button class="filter-btn" data-filter="系统美化" onclick="filterPackages('系统美化')">系统美化</button>
        <button class="filter-btn" data-filter="灵动岛" onclick="filterPackages('灵动岛')">灵动岛</button>
        <button class="filter-btn" data-filter="分屏插件" onclick="filterPackages('分屏插件')">分屏插件</button>
        <button class="filter-btn" data-filter="终端工具" onclick="filterPackages('终端工具')">终端工具</button>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索插件名称…" oninput="searchPackages()">
    </div>

    <div class="pkg-grid" id="pkgGrid"></div>
</section>

<!-- ========== Footer ========== -->
<footer class="footer">
    <div class="footer-links">
        <a href="https://github.com/jj1625800985/sileo-repo" target="_blank">GitHub</a>
        <a href="javascript:void(0)" onclick="addToSileo()">添加到 Sileo</a>
        <a href="https://jj1625800985.github.io/sileo-repo" target="_blank">源地址</a>
    </div>
    <p>Sxllm Source &copy; 2025 &middot; 由 GitHub Pages 强力驱动</p>
</footer>

<!-- ========== Toast ========== -->
<div class="toast" id="toast"></div>

<!-- ========== JavaScript ========== -->
<script>
// ===== Package Data (从 packages.json 动态加载) =====
let PACKAGES = [];
let sectionsSet = new Set();

// ===== Render =====
function getIconUrl(pkgId) {
    return 'https://jj1625800985.github.io/sileo-repo/icon/' + pkgId + '.png';
}

function getSileoDepictionUrl(pkgId) {
    return 'https://jj1625800985.github.io/sileo-repo/depictions/' + pkgId + '/info.json';
}

function getSectionClass(section) {
    switch (section) {
        case '开发工具': return 'development';
        case '终端工具': return 'terminal';
        case '系统美化': return 'tweaks';
        case '灵动岛': return 'dynamic';
        case '分屏插件': return 'split';
        default: return '';
    }
}

function renderPackageCard(pkg) {
    return `
        <div class="pkg-card" data-section="${pkg.section}" data-name="${pkg.name.toLowerCase()}" data-id="${pkg.id}">
            <img src="${getIconUrl(pkg.id)}" alt="${pkg.name}" class="pkg-icon"
                 onerror="this.src='CydiaIcon.png'">
            <div class="pkg-info">
                <div class="pkg-name">${pkg.name}</div>
                <div class="pkg-version">v${pkg.version}</div>
                <div class="pkg-desc">${pkg.desc}</div>
                <span class="pkg-section-tag ${getSectionClass(pkg.section)}">${pkg.section}</span>
            </div>
        </div>
    `;
}

function renderPackages(packages, containerId) {
    const container = document.getElementById(containerId);
    if (packages.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">没有匹配的插件</div>';
        return;
    }
    container.innerHTML = packages.map(renderPackageCard).join('');
}

// ===== Filter & Search =====
let currentFilter = 'all';
let currentSearch = '';

function filterPackages(section) {
    currentFilter = section;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === section);
    });
    applyFilters();
}

function searchPackages() {
    currentSearch = document.getElementById('searchInput').value.toLowerCase().trim();
    applyFilters();
}

function applyFilters() {
    let filtered = PACKAGES;

    // Apply section filter
    if (currentFilter !== 'all') {
        filtered = filtered.filter(p => p.section === currentFilter);
    }

    // Apply search
    if (currentSearch) {
        filtered = filtered.filter(p =>
            p.name.toLowerCase().includes(currentSearch) ||
            p.desc.toLowerCase().includes(currentSearch) ||
            p.section.includes(currentSearch)
        );
    }

    renderPackages(filtered, 'pkgGrid');
}

// ===== Add to Sileo =====
function addToSileo() {
    // sileo:// URL scheme to add source
    const url = 'sileo://source/https://jj1625800985.github.io/sileo-repo';
    window.location.href = url;
    showToast('正在打开 Sileo…');

    // Fallback after 1.5s if Sileo didn't open
    setTimeout(() => {
        showToast('如果 Sileo 未打开，请手动复制源地址添加', 3000);
    }, 1500);
}

function copySourceUrl() {
    const url = 'https://jj1625800985.github.io/sileo-repo';
    if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
            showToast('源地址已复制！打开 Sileo → 源 → + 粘贴添加');
        }).catch(() => {
            fallbackCopy(url);
        });
    } else {
        fallbackCopy(url);
    }
}

function fallbackCopy(text) {
    const el = document.createElement('textarea');
    el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('源地址已复制！打开 Sileo → 源 → + 粘贴添加');
}

// ===== Toast =====
let toastTimer = null;
function showToast(msg, duration) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove('show');
    }, duration || 2500);
}

// ===== Sections order for filter buttons =====
const SECTION_ORDER = ['开发工具', '系统美化', '灵动岛', '分屏插件', '终端工具', '系统工具'];

function buildFilterButtons() {
    const bar = document.querySelector('.filter-bar');
    // Remove old dynamic buttons (keep the search input)
    const searchInput = document.getElementById('searchInput');
    const oldButtons = bar.querySelectorAll('.filter-btn:not([data-filter="all"])');
    oldButtons.forEach(b => b.remove());

    // Insert before search input
    const refNode = searchInput || null;

    SECTION_ORDER.forEach(section => {
        if (!sectionsSet.has(section)) return;
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = section;
        btn.textContent = section;
        btn.onclick = function() { filterPackages(section); };
        bar.insertBefore(btn, refNode);
    });
}

function updateStats() {
    const pkgCount = PACKAGES.length;
    const secCount = sectionsSet.size;
    document.getElementById('pkgCount').textContent = pkgCount;
    document.getElementById('sectionCount').textContent = secCount;
}

// ===== Init =====
document.addEventListener('DOMContentLoaded', function() {
    // 加载前显示加载中
    document.getElementById('featuredGrid').innerHTML =
        '<div style="text-align:center;padding:40px;color:var(--text-muted)">加载中…</div>';
    document.getElementById('pkgGrid').innerHTML =
        '<div style="text-align:center;padding:40px;color:var(--text-muted)">加载中…</div>';

    fetch('packages.json?_t=' + Date.now())
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(data) {
            PACKAGES = data;
            // 收集所有分类
            PACKAGES.forEach(function(p) { sectionsSet.add(p.section); });

            updateStats();
            buildFilterButtons();

            // Render featured
            const featured = PACKAGES.filter(function(p) { return p.featured; });
            renderPackages(featured, 'featuredGrid');

            // Render all
            renderPackages(PACKAGES, 'pkgGrid');
        })
        .catch(function(err) {
            console.error('加载 packages.json 失败:', err);
            document.getElementById('featuredGrid').innerHTML =
                '<div style="text-align:center;padding:40px;color:var(--text-muted)">加载失败，请刷新重试</div>';
            document.getElementById('pkgGrid').innerHTML =
                '<div style="text-align:center;padding:40px;color:var(--text-muted)">加载失败，请刷新重试</div>';
        });
});
</script>

</body>
</html>
